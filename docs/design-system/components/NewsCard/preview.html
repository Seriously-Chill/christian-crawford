<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:24px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:640px;}
  .card{background:var(--surface-raised);border-radius:24px;padding:24px;}
  a{text-decoration:none;color:inherit;}
  h3{font-size:18px;line-height:1.4em;font-weight:500;letter-spacing:-0.02em;color:var(--ink);margin:0 0 8px 0;}
  p{font-size:14px;line-height:1.4em;color:var(--ink);opacity:.72;margin:0;}
</style>
</head>
<body>
  <div class="grid">
    <a class="card" href="#">
      <h3>Christian Crawford is now on sale throughout Ukraine</h3>
      <p>Christian Crawford is actively expanding its presence and is already available in most national retail chains.</p>
    </a>
    <a class="card" href="#">
      <h3>Christian Crawford at Food&amp;NonFood Master 2026: a Ukrainian brand that surprises</h3>
    </a>
  </div>
</body>
</html>
