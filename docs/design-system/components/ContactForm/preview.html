<!-- @dsCard group="Forms" height=380 subtitle="Real kit input style — transparent fill, translucent border, on the header's own gradient" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:var(--font-sans);background:linear-gradient(90deg, #236FC4E6 0%, #58C4E6E6 100%);padding:32px;}
  form{max-width:360px;display:flex;flex-direction:column;gap:16px;}
  label{font-size:16px;font-weight:500;letter-spacing:-0.02em;color:#fff;display:block;margin-bottom:8px;}
  input,textarea{width:100%;box-sizing:border-box;padding:24px;border:1px solid #FFFFFF33;border-radius:12px;background:transparent;font-size:16px;font-weight:500;letter-spacing:-0.02em;font-family:var(--font-sans);color:#fff;}
  input::placeholder,textarea::placeholder{color:#FFFFFF99;}
  input:focus,textarea:focus{outline:none;border-color:#fff;}
  button{align-self:flex-start;padding:12px 24px;border-radius:100px;border:1px solid #fff;background:transparent;color:#fff;font-size:16px;font-weight:500;letter-spacing:-0.03em;cursor:pointer;}
  button:hover{background:#fff;color:var(--primary);}
  .success{display:none;font-size:16px;color:#fff;padding:24px 0;}
</style>
</head>
<body>
  <form id="f">
    <div><label>Name</label><input type="text"></div>
    <div><label>Phone</label><input type="tel"></div>
    <div><label>Email</label><input type="email"></div>
    <div><label>Message</label><textarea rows="3"></textarea></div>
    <button type="submit">Send</button>
  </form>
  <div class="success" id="s">Our team will contact you shortly.</div>
  <script>
    document.getElementById('f').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('f').style.display = 'none';
      document.getElementById('s').style.display = 'block';
    });
  </script>
</body>
</html>
