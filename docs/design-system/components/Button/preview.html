<!-- @dsCard group="Marketing" height=100 subtitle="Default, hover, and the bordered variant — hover the filled one" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);display:flex;align-items:center;gap:24px;padding:24px;}
  .btn{display:inline-block;padding:12px 24px;border-radius:100px;font-size:16px;font-weight:500;letter-spacing:-0.03em;text-decoration:none;transition:background-color .15s,color .15s;}
  .primary{background:var(--surface);color:var(--primary);}
  .primary:hover{background:var(--primary);color:var(--surface);}
  .bordered{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:11px 23px;}
</style>
</head>
<body>
  <a class="btn primary" href="#">More details</a>
  <a class="btn bordered" href="#">Learn about the brand</a>
</body>
</html>
