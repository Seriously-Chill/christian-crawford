<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:24px;}
  h2{font-size:20px;font-weight:500;color:var(--ink);margin:0 0 16px 0;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:760px;}
  .tile{background:var(--surface-raised);border-radius:24px;padding:16px;text-align:center;font-size:14px;font-weight:500;color:var(--ink);}
</style>
</head>
<body>
  <h2>All types</h2>
  <div class="grid">
    <div class="tile">Lemon &amp; Verbena Tea</div>
    <div class="tile">Green Apple</div>
    <div class="tile">Pomegranate &amp; Berries</div>
    <div class="tile">Cactus Blossom</div>
    <div class="tile">White Peach</div>
    <div class="tile">KID Dishes</div>
    <div class="tile">Balanced Edition Sensitive</div>
    <div class="tile">Extra Power</div>
  </div>
</body>
</html>
