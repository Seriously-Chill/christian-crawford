<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);}
  .hero{padding:60px 24px;text-align:left;max-width:640px;}
  h1{font-size:56px;line-height:1em;font-weight:400;letter-spacing:-0.04em;color:var(--ink);margin:0 0 16px 0;}
  p{font-size:16px;font-weight:500;letter-spacing:-0.02em;line-height:1.5em;color:var(--ink);margin:0 0 32px 0;}
  .ctas{display:flex;gap:16px;}
  .btn{display:inline-block;padding:12px 24px;border-radius:100px;font-size:16px;font-weight:500;letter-spacing:-0.03em;text-decoration:none;}
  .primary{background:var(--surface);color:var(--primary);}
  .primary:hover{background:var(--primary);color:var(--surface);}
  .bordered{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:11px 23px;}
</style>
</head>
<body>
  <div class="hero">
    <h1>Christian Crawford – premium cleanliness</h1>
    <p>Innovations that take care of the cleanliness of your home every day</p>
    <div class="ctas">
      <a class="btn primary" href="#">Get to know the range</a>
      <a class="btn bordered" href="#">Learn about the brand</a>
    </div>
  </div>
</body>
</html>
